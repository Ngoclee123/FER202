<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Grid Test Layout</title>
  </head>
  <body>
    <div class="container-fluid">
      <!-- Header Section -->
      <div class="row">
        <div class="col-12 bg-light p-4">
          <h1 class="text-dark mb-0">Let's test the grid!</h1>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="row mt-4">
        <div class="col-12">
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link active" href="#">Active</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled">Disabled</a>
            </li>
          </ul>
        </div>
      </div>

      <!-- Grid Layout Section -->
      <div class="row mt-4">
        <!-- First Row: Two columns -->
        <div class="col-6">
          <div class="border bg-secondary text-white p-3">First col</div>
        </div>
        <div class="col-6">
          <div class="border bg-secondary text-white p-3">Second col</div>
        </div>
      </div>

      <div class="row mt-2">
        <!-- Second Row: Three columns -->
        <div class="col-4">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
        <div class="col-4">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
        <div class="col-4">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
      </div>

      <div class="row mt-2">
        <!-- Third Row: Four columns -->
        <div class="col-3">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
        <div class="col-3">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
        <div class="col-3">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
        <div class="col-3">
          <div class="border bg-secondary text-white p-3">col</div>
        </div>
      </div>

      <!-- Footer Section -->
      <div class="row mt-5">
        <div class="col-12 text-center py-4" style="background-color: #c8b5b0">
          <h3 class="text-dark mb-0">Created by ABC!</h3>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
